name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar sintaxis (app.js, core.js, sw.js, autotest, vendor)
        run: npm run check

      - name: Ejecutar tests del núcleo
        run: npm run test
